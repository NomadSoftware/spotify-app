<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tokens live in localStorage, so a single injected script could
         exfiltrate them: restrict script/style/image/connect origins.
         'unsafe-inline' is required by the Vite dev preamble and injected
         dev styles; script-src still blocks cross-origin script loads. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.scdn.co; connect-src 'self' https://api.spotify.com https://accounts.spotify.com ws:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎧</text></svg>"
    />
    <title>Spotify Personal Tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
