packages:
  - '.'

# Which dependencies may run install (postinstall) scripts. pnpm 11 refuses
# them by default — the supply-chain-attack vector the scan in .github
# complements. Verified live (2026-11-27): a from-scratch install with both
# scripts disabled passes the tests and the vite build — esbuild resolves its
# platform binary through optionalDependencies (no script needed), and
# workerd's binary is only fetched for `wrangler dev`, which this app never
# uses (deploys are assets-only via CI). Kept as explicit `false` entries so a
# future version re-adding a script doesn't silently start executing.
allowBuilds:
  workerd: false
  esbuild: false

# pnpm 11 defaults to a 24h supply-chain cooldown before it'll install a
# newly-published package version — a defense against attacks where a
# compromised version gets consumed within minutes of publishing. Disabled
# here rather than tuned to a shorter window: every dependency bump in this
# repo already goes through CI (tests + build + the supply-chain scan) before
# merge, which is the actual safeguard, and a blanket 24h delay would
# otherwise block that same day's fix on an already-vetted version.
minimumReleaseAge: 0
